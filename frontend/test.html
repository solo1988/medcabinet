<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Сканер препаратов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="/static/index.css" rel="stylesheet"/>
    <style>
        #reader { width: 100%; max-width: 500px; margin: 0 auto; }
        #status { font-size: 1.1rem; min-height: 2.5rem; }
        .status-scanning { color: #0d6efd; }
        .status-found { color: #198754; }
        .status-sending { color: #fd7e14; }
        .status-error { color: #dc3545; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">📦 Сканирование лекарства</h2>
    </div>

    <div id="reader" class="mb-3 border rounded overflow-hidden"></div>

    <div id="status" class="alert alert-info status-scanning text-center">
        Ищем DataMatrix...
    </div>

    <div id="medicineInfo" class="card d-none">
        <div class="card-body">
            <h5 class="card-title" id="medName"></h5>
            <p class="card-text small">
                <strong>GTIN:</strong> <span id="medGTIN" class="text-break"></span><br/>
                <strong>Серийный номер:</strong> <span id="medSerial" class="text-break"></span><br/>
                <strong>Годен до:</strong> <span id="medExp" class="text-break"></span><br/>
                <strong>Производитель:</strong> <span id="medManufacturer" class="text-break"></span><br/>
                <strong>Статус:</strong> <span id="medStatus" class="text-break"></span>
            </p>
            <button id="addBtn" class="btn btn-success mt-1">💾 Добавить в базу</button>
            <button id="rescanBtn" class="btn btn-outline-secondary mt-1 ms-2">🔄 Сканировать ещё</button>
        </div>
    </div>
</div>

<nav id="bottomMenu" class="d-flex border-top mt-5">
    <button id="btnBack" type="button" class="btn btn-link" title="Назад">
        <i class="bi bi-arrow-left"></i>
    </button>
    <button id="btnHome" type="button" class="btn btn-link" title="Главная">
        <i class="bi bi-house"></i>
    </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/static/test.js?v=0.1"></script>
</body>
</html>
